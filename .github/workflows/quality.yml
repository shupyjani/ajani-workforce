name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    name: Application quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      PLAYWRIGHT_OUTPUT_DIR: test-results
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Use pinned Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version-file: .node-version

      - name: Install locked dependencies
        run: npm ci

      - name: Install the Chromium test runtime
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck every workspace and browser suite
        run: npm run typecheck

      - name: Test database
        run: npm run test:database

      - name: Test web
        run: npm run test:web

      - name: Test API
        run: npm run test:api

      - name: Verify clean migration, deterministic seed and reset
        run: npm run db:verify

      - name: Build production bundles
        run: npm run build

      - name: Enforce web bundle budget
        run: npm run check:bundle

      - name: Test browser journeys and accessibility
        run: npm run test:e2e

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: ignore
          name: playwright-failure-${{ github.run_id }}
          path: test-results
          retention-days: 7

  postgres-concurrency:
    name: PostgreSQL concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AJANI_POSTGRES_TEST_URL: postgres://ajani_test:ajani_test@127.0.0.1:5432/ajani_test
      CI: 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ajani_test
          POSTGRES_PASSWORD: ajani_test
          POSTGRES_USER: ajani_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ajani_test -d ajani_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Use pinned Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version-file: .node-version

      - name: Install locked dependencies
        run: npm ci

      - name: Verify PostgreSQL lock behavior
        run: npm run test:postgres

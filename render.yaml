services:
  - type: web
    name: ajani-workforce-api
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 24.19.0
      - key: AJANI_DATA_MODE
        value: postgres
      - key: AJANI_HOSTED_PREVIEW_RESET
        value: synthetic-preview-only
